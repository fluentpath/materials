<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluent Path ESL Corner — Life Experiences</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F8FF; --card:#FFFFFF; --card-tint:#E9F3FE;
  --ink:#12213D; --ink-soft:#51628A; --border:#D8E7FA;
  --blue-light:#5EC6F7; --blue-mid:#2F6FED; --blue-deep:#14349E;
  --amber:#F4A93A; --amber-bg:#FFF3E0;
  --success-bg:#E8F8EF; --success-ink:#178A54; --success-border:#3FBE7E;
  --error-bg:#FDECEC; --error-ink:#C1352E; --error-border:#EF7A73;
  --shadow: 0 10px 28px rgba(18,33,61,0.10);
  --shadow-sm: 0 4px 12px rgba(18,33,61,0.08);
  --radius: 20px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1730; --card:#122544; --card-tint:#16294C;
    --ink:#EAF1FF; --ink-soft:#AEC0E8; --border:#223A63;
    --blue-light:#6ECBFA; --blue-mid:#5B8CFB; --blue-deep:#8FB0FF;
    --amber:#FFC266; --amber-bg:#3A2E14;
    --success-bg:#123A26; --success-ink:#6EE0A6; --success-border:#2E7D51;
    --error-bg:#3B1917; --error-ink:#FF9B93; --error-border:#A5443C;
    --shadow: 0 10px 28px rgba(0,0,0,0.35);
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1730; --card:#122544; --card-tint:#16294C;
  --ink:#EAF1FF; --ink-soft:#AEC0E8; --border:#223A63;
  --blue-light:#6ECBFA; --blue-mid:#5B8CFB; --blue-deep:#8FB0FF;
  --amber:#FFC266; --amber-bg:#3A2E14;
  --success-bg:#123A26; --success-ink:#6EE0A6; --success-border:#2E7D51;
  --error-bg:#3B1917; --error-ink:#FF9B93; --error-border:#A5443C;
  --shadow: 0 10px 28px rgba(0,0,0,0.35);
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;}
html{scroll-padding-top: calc(120px + var(--safe-top));}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  -webkit-tap-highlight-color: transparent;
}
h1,h2,h3,h4{font-family:'Quicksand',system-ui,sans-serif; font-weight:700; color:var(--ink); margin:0 0 .4em;}
p{line-height:1.6; color:var(--ink-soft);}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--blue-mid); outline-offset:2px; border-radius:8px;}
img{max-width:100%; display:block;}

/* ---------- Header ---------- */
header.topbar{
  position:sticky; top: var(--safe-top); z-index:50;
  background:linear-gradient(120deg,var(--blue-deep),var(--blue-mid) 55%,var(--blue-light));
  padding: 10px 16px;
  box-shadow: var(--shadow);
}
.topbar-inner{max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px;}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand img{width:40px; height:auto; border-radius:10px; background:rgba(255,255,255,.15);}
.brand-text{color:#fff; line-height:1.15;}
.brand-text .b1{font-family:'Quicksand'; font-weight:700; font-size:1.05rem; letter-spacing:.02em;}
.brand-text .b2{font-size:.72rem; opacity:.9; letter-spacing:.08em;}
.topbar-right{margin-left:auto; display:flex; gap:8px; flex-shrink:0;}
.icon-btn{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:12px; padding:8px 12px; font-size:.85rem; cursor:pointer; font-weight:600;
  display:flex; align-items:center; gap:6px; transition:.15s;
}
.icon-btn:hover{background:rgba(255,255,255,.28);}

nav.tabs{max-width:1100px; margin:10px auto 0; display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin;}
nav.tabs::-webkit-scrollbar{height:6px;}
nav.tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.4); border-radius:6px;}
.tab-btn{
  flex:0 0 auto; background:rgba(255,255,255,.10); color:#fff; border:1px solid transparent;
  padding:9px 14px; border-radius:14px; font-size:.85rem; font-weight:600; cursor:pointer;
  white-space:nowrap; display:flex; align-items:center; gap:6px; transition:.15s;
}
.tab-btn:hover{background:rgba(255,255,255,.22);}
.tab-btn.active{background:#fff; color:var(--blue-deep); box-shadow:var(--shadow-sm);}

.progress-wrap{max-width:1100px; margin:10px auto 0; padding:0 2px 8px;}
.progress-label{color:#fff; font-size:.78rem; font-weight:600; margin-bottom:5px; display:flex; justify-content:space-between; opacity:.95;}
.progress-track{height:9px; background:rgba(255,255,255,.25); border-radius:20px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--amber),#fff); border-radius:20px; transition:width .4s ease;}

/* ---------- Layout ---------- */
main{max-width:1100px; margin:0 auto; padding:22px 16px 40px;}
.section{display:none; animation:fadeIn .35s ease;}
.section.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:22px; margin-bottom:18px;}
.hero{
  background:linear-gradient(135deg,var(--blue-light),var(--blue-mid) 70%,var(--blue-deep));
  border-radius:24px; padding:30px 26px; color:#fff; margin-bottom:20px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.hero h1{color:#fff; font-size:clamp(1.6rem,4vw,2.3rem); margin-bottom:6px;}
.hero p.sub{color:#EAF3FF; font-size:1.05rem; font-style:italic; margin:0;}
.hero .hero-logo{position:absolute; right:22px; top:22px; width:78px; opacity:.9;}
@media (max-width:640px){.hero .hero-logo{display:none;}}

.note{
  background:var(--amber-bg); border:1px solid var(--amber); border-radius:16px;
  padding:14px 16px; font-size:.95rem; color:var(--ink); margin:14px 0;
}
.obj-list{list-style:none; padding:0; margin:0; display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.obj-list li{background:var(--card-tint); border-radius:14px; padding:12px 14px; font-size:.95rem; display:flex; gap:8px;}

.grid-2{display:grid; gap:18px; grid-template-columns:1fr 1fr;}
@media (max-width:760px){.grid-2{grid-template-columns:1fr;}}

.pp-card, .ps-card{border-radius:20px; padding:20px; box-shadow:var(--shadow-sm);}
.pp-card{background:linear-gradient(160deg,#EAF6FF,#DCEEFF); border:1px solid var(--blue-light);}
.ps-card{background:linear-gradient(160deg,#EEF2FF,#E4EAFB); border:1px solid var(--blue-deep);}
.tag-pill{display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.03em; padding:4px 10px; border-radius:20px; margin-bottom:10px;}
.pp-card .tag-pill{background:var(--blue-mid); color:#fff;}
.ps-card .tag-pill{background:var(--blue-deep); color:#fff;}
.formula{font-family:'Quicksand'; font-weight:700; font-size:1.05rem; background:rgba(255,255,255,.6); border-radius:10px; padding:8px 12px; margin:8px 0; display:inline-block;}
:root[data-theme="dark"] .formula{background:rgba(0,0,0,.25);}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .formula{background:rgba(0,0,0,.25);} }
.ex-list{margin:10px 0; padding-left:0; list-style:none;}
.ex-list li{background:rgba(255,255,255,.55); border-radius:10px; padding:8px 12px; margin-bottom:6px; font-style:italic;}
.small-list{margin:8px 0; padding-left:20px; color:var(--ink-soft); font-size:.92rem;}
.word-chips{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.word-chip{background:#fff; border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-weight:600; font-size:.85rem;}

.timeline{background:var(--card-tint); border-radius:16px; padding:18px; margin:14px 0;}
.timeline-row{display:flex; align-items:center; gap:10px; margin:10px 0; font-size:.9rem;}
.timeline-row .label{width:120px; flex-shrink:0; font-weight:700; font-family:'Quicksand';}
.tline{flex:1; height:4px; background:var(--border); border-radius:4px; position:relative;}
.tline .dot{position:absolute; top:50%; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%; background:var(--blue-mid); border:3px solid var(--card);}
.tline .checkmark{position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:1rem;}
.tline.exp{background:linear-gradient(90deg,var(--border),var(--blue-light));}

.compare-pairs{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); margin-top:12px;}
.pair-card{background:var(--card-tint); border-radius:16px; padding:14px 16px;}
.pair-card .l1{color:var(--blue-deep); font-weight:600; margin-bottom:4px;}
.pair-card .l2{color:var(--ink); font-weight:600;}
.pair-card .why{margin-top:8px; font-size:.82rem; color:var(--ink-soft);}

.rule-box{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0;}
.rule-box .bad, .rule-box .good{flex:1; min-width:200px; padding:10px 14px; border-radius:12px; font-weight:600;}
.rule-box .bad{background:var(--error-bg); color:var(--error-ink); border:1px solid var(--error-border);}
.rule-box .good{background:var(--success-bg); color:var(--success-ink); border:1px solid var(--success-border);}

.infographic{background:linear-gradient(135deg,var(--blue-deep),var(--blue-mid)); border-radius:20px; padding:24px; color:#fff; display:grid; grid-template-columns:1fr auto 1fr; gap:18px; align-items:center;}
@media (max-width:700px){.infographic{grid-template-columns:1fr;}}
.infographic .col h3{color:#fff;}
.infographic .vs{font-family:'Quicksand'; font-weight:700; font-size:1.4rem; text-align:center; opacity:.85;}
.infographic .col{background:rgba(255,255,255,.10); border-radius:14px; padding:16px;}
.infographic .col p{color:#EAF3FF;}
.infographic .ex{background:rgba(255,255,255,.18); border-radius:10px; padding:8px 10px; margin-top:8px; font-style:italic;}

details.teacher{background:var(--card-tint); border-radius:14px; padding:12px 16px; margin-top:16px;}
details.teacher summary{cursor:pointer; font-weight:700; font-family:'Quicksand'; color:var(--blue-deep);}
details.teacher ul{margin:10px 0 4px; padding-left:20px; color:var(--ink-soft);}

/* ---------- Questions ---------- */
.qcard{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-sm);}
.qtag{display:inline-block; background:var(--card-tint); color:var(--blue-deep); font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:8px; letter-spacing:.02em;}
.qnum{font-weight:700; color:var(--ink-soft); font-size:.85rem;}
.qtext{font-size:1.08rem; font-weight:600; margin:6px 0 12px; font-family:'Quicksand';}
.options{display:grid; gap:10px;}
.opt-btn{
  text-align:left; background:var(--card-tint); border:2px solid var(--border); border-radius:12px;
  padding:11px 14px; font-size:.98rem; cursor:pointer; color:var(--ink); display:flex; align-items:center; gap:10px;
  transition:.15s;
}
.opt-btn:hover:not(:disabled){border-color:var(--blue-mid);}
.opt-btn:disabled{cursor:default;}
.opt-btn .letter{width:24px; height:24px; border-radius:50%; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; flex-shrink:0;}
.opt-btn.correct{background:var(--success-bg); border-color:var(--success-border); color:var(--success-ink);}
.opt-btn.incorrect{background:var(--error-bg); border-color:var(--error-border); color:var(--error-ink);}
.opt-btn.reveal{background:var(--success-bg); border-color:var(--success-border); color:var(--success-ink);}
.feedback{margin-top:12px; padding:12px 14px; border-radius:12px; font-size:.92rem;}
.feedback.correct{background:var(--success-bg); color:var(--success-ink); border:1px solid var(--success-border);}
.feedback.incorrect{background:var(--error-bg); color:var(--error-ink); border:1px solid var(--error-border);}
.feedback .fb-title{font-weight:700; font-family:'Quicksand'; margin-bottom:3px;}

.score-bar{position:sticky; top:calc(120px + var(--safe-top)); z-index:5; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:10px 16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow-sm); font-weight:700; font-family:'Quicksand'; flex-wrap:wrap; gap:6px;}
.score-bar .pct{color:var(--blue-deep);}

.summary-box{background:linear-gradient(135deg,var(--blue-deep),var(--blue-mid)); color:#fff; border-radius:20px; padding:24px; text-align:center; margin-top:10px;}
.summary-box h2{color:#fff;}
.summary-box .big{font-size:2.6rem; font-family:'Quicksand'; font-weight:700;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; background:var(--blue-mid); color:#fff; border:none;
  padding:12px 20px; border-radius:14px; font-weight:700; font-size:.95rem; cursor:pointer; transition:.15s;
  font-family:'Quicksand';
}
.btn:hover{background:var(--blue-deep);}
.btn.secondary{background:var(--card-tint); color:var(--blue-deep); border:1px solid var(--border);}
.btn.secondary:hover{background:var(--border);}
.btn.amber{background:var(--amber); color:#5A3A05;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

footer.navbar{
  position:sticky; bottom: var(--safe-bottom); background:var(--card); border-top:1px solid var(--border);
  padding:10px 16px; display:flex; justify-content:space-between; gap:8px;
  box-shadow:0 -6px 18px rgba(18,33,61,.06); z-index:40; flex-wrap:wrap;
}
.navbar .side{display:flex; gap:8px; flex-wrap:wrap;}

/* ---------- Welcome warm-up ---------- */
.flip-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-top:14px;}
.flip-card{background:var(--card-tint); border:1px solid var(--border); border-radius:16px; padding:16px 12px; text-align:center; cursor:pointer; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; transition:.2s;}
.flip-card:hover{box-shadow:var(--shadow-sm); transform:translateY(-2px);}
.flip-card .emoji{font-size:1.8rem;}
.flip-card .lbl{font-weight:700; font-size:.85rem;}
.flip-card.done{background:var(--success-bg); border-color:var(--success-border);}
.flip-card .reveal-text{font-size:.82rem; color:var(--ink-soft); font-style:italic; margin-top:4px;}
.warmup-progress{margin-top:10px; font-weight:700; color:var(--blue-deep); font-size:.9rem;}

/* ---------- Game ---------- */
.game-wrap{background:linear-gradient(160deg,#EAF6FF,#F5FAFF); border-radius:22px; padding:22px; box-shadow:var(--shadow-sm); border:1px solid var(--border);}
.game-hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px; font-family:'Quicksand'; font-weight:700; color:var(--blue-deep);}
.game-map{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px;}
@media (max-width:640px){.game-map{grid-template-columns:repeat(2,1fr);}}
.map-spot{background:#fff; border:1px solid var(--border); border-radius:12px; text-align:center; padding:8px 4px; font-size:.78rem; font-weight:700; color:var(--ink-soft); opacity:.55; transition:.25s;}
.map-spot.active{opacity:1; background:var(--blue-mid); color:#fff; border-color:var(--blue-mid); box-shadow:var(--shadow-sm);}
.game-sentence{background:#fff; border-radius:16px; padding:20px; text-align:center; font-size:1.25rem; font-weight:600; font-family:'Quicksand'; margin-bottom:20px; border:1px solid var(--border);}
.blank-box{
  display:inline-flex; min-width:130px; height:44px; align-items:center; justify-content:center;
  border:3px dashed var(--blue-mid); border-radius:12px; padding:0 14px; margin:0 6px; background:var(--card-tint);
  font-weight:700; color:var(--blue-deep); vertical-align:middle; transition:.15s;
}
.blank-box.over{background:#DCEEFF; box-shadow:0 0 0 4px rgba(47,111,237,.25);}
.blank-box.filled{border-style:solid; background:var(--success-bg); border-color:var(--success-border); color:var(--success-ink);}
.blank-box.shake{animation:shake .4s;}
@keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(5px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
.chip-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
.chip{
  background:linear-gradient(160deg,#fff,#EAF3FF); border:2px solid var(--blue-mid); color:var(--blue-deep);
  font-weight:700; font-family:'Quicksand'; padding:12px 18px; border-radius:14px; cursor:grab; user-select:none;
  box-shadow:var(--shadow-sm); touch-action:none; animation:floaty 3s ease-in-out infinite;
}
.chip:nth-child(2){animation-delay:.4s;}
.chip:nth-child(3){animation-delay:.8s;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.chip.selected{outline:3px solid var(--amber);}
.chip.dragging{opacity:.85; cursor:grabbing; animation:none; box-shadow:0 14px 26px rgba(18,33,61,.25); z-index:200;}
.chip.used{visibility:hidden;}
.chip.sparkle{animation:sparkle .6s;}
@keyframes sparkle{0%{transform:scale(1);}40%{transform:scale(1.15); box-shadow:0 0 0 8px rgba(63,190,126,.25);}100%{transform:scale(1);}}
.game-feedback{margin-top:16px; border-radius:14px; padding:14px 16px; font-size:.95rem; display:none;}
.game-feedback.show{display:block;}
.game-hint{color:var(--ink-soft); font-size:.85rem; margin-top:6px;}

/* ---------- Listening ---------- */
.player{background:var(--card-tint); border-radius:16px; padding:18px; display:flex; flex-wrap:wrap; align-items:center; gap:12px;}
.speed-group{display:flex; gap:6px; margin-left:auto;}
.speed-btn{background:#fff; border:1px solid var(--border); border-radius:10px; padding:6px 10px; font-size:.8rem; font-weight:700; cursor:pointer;}
.speed-btn.active{background:var(--blue-mid); color:#fff; border-color:var(--blue-mid);}
.transcript-box{background:var(--card-tint); border-radius:14px; padding:16px; margin-top:12px; display:none; line-height:1.7;}
.transcript-box.show{display:block;}

/* ---------- Homework review ---------- */
.review-item{border-left:5px solid var(--border); padding:10px 14px; margin-bottom:12px; background:var(--card-tint); border-radius:0 12px 12px 0;}
.review-item.ok{border-color:var(--success-border);}
.review-item.no{border-color:var(--error-border);}
.review-item .rq{font-weight:700; margin-bottom:4px;}
.review-item .ra{font-size:.9rem; margin:2px 0;}
.review-item .rwhy{font-size:.85rem; color:var(--ink-soft); margin-top:4px;}

/* ---------- Results ---------- */
.results-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:20px;}
.result-tile{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:center; box-shadow:var(--shadow-sm);}
.result-tile .pctnum{font-size:1.8rem; font-family:'Quicksand'; font-weight:700; color:var(--blue-deep);}
.result-tile .bar{height:8px; background:var(--border); border-radius:8px; overflow:hidden; margin-top:8px;}
.result-tile .bar span{display:block; height:100%; background:linear-gradient(90deg,var(--blue-light),var(--blue-deep));}
.remember-box{display:flex; gap:16px; flex-wrap:wrap; margin-top:16px;}
.remember-box .rc{flex:1; min-width:220px; border-radius:14px; padding:14px 16px;}
.remember-box .rc.pp{background:#EAF6FF; border:1px solid var(--blue-light);}
.remember-box .rc.ps{background:#EEF2FF; border:1px solid var(--blue-deep);}

.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>

<header class="topbar">

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function prepQuestions(bank){
  return bank.map(q=>{
    const idxs = shuffle(q.opts.map((_,i)=>i));
    const opts = idxs.map(i=>q.opts[i]);
    const correct = idxs.indexOf(q.correct);
    return {tag:q.tag, text:q.q, opts, correct, why:q.why, selected:null};
  });
}

/* ============================================================

function renderQuizSection(sectionKey, containerId, title, introHTML){
  const container = document.getElementById(containerId);
  const items = state[sectionKey];
  let html = introHTML || '';
  html += `<div class="score-bar"><span>📊 ${title} Progress</span><span class="pct" id="scoretext-${sectionKey}">Score: 0 / ${items.length} (0%)</span></div>`;
  items.forEach((item,i)=>{
    html += `<div class="qcard" data-qi="${i}">
      <div class="qnum">Question ${i+1} of ${items.length}</div>
      ${item.tag ? `<div class="qtag">${item.tag}</div>` : ''}
      <div class="qtext">${item.text}</div>
      <div class="options" id="opts-${sectionKey}-${i}">
        ${item.opts.map((opt,oi)=>`<button class="opt-btn" data-oi="${oi}"><span class="letter">${LETTERS[oi]}</span><span>${opt}</span></button>`).join('')}
      </div>
      <div class="feedback" id="fb-${sectionKey}-${i}" style="display:none;"></div>
    </div>`;
  });
  html += `<div class="summary-box" id="summary-${sectionKey}">
    <h2>${title} Score</h2>
    <div class="big" id="summarybig-${sectionKey}">0 / ${items.length}</div>
    <div id="summarypct-${sectionKey}">0%</div>
    <div id="summarymsg-${sectionKey}" style="margin-top:8px;"></div>
  </div>`;
  container.innerHTML = html;

  items.forEach((item,i)=>{
    const optsWrap = document.getElementById(`opts-${sectionKey}-${i}`);
    optsWrap.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>answerQuiz(sectionKey, i, parseInt(btn.dataset.oi,10)));
    });
  });
  updateQuizScore(sectionKey, title);
}

function answerQuiz(sectionKey, i, oi){
  const item = state[sectionKey][i];
  if(item.selected !== null) return; // locked after first answer
  item.selected = oi;
  const optsWrap = document.getElementById(`opts-${sectionKey}-${i}`);
  const buttons = optsWrap.querySelectorAll('.opt-btn');
  buttons.forEach(b=>b.disabled = true);
  const isCorrect = oi === item.correct;
  buttons[item.correct].classList.add('correct');
  if(!isCorrect){ buttons[oi].classList.add('incorrect'); }
  const fb = document.getElementById(`fb-${sectionKey}-${i}`);
  fb.style.display = 'block';
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
  fb.innerHTML = `<div class="fb-title">${isCorrect ? '✅ Correct!' : '❌ Not quite!'}</div>
    ${!isCorrect ? `<div><strong>Correct answer:</strong> ${item.opts[item.correct]}</div>` : ''}
    <div style="margin-top:4px;"><strong>Why:</strong> ${item.why}</div>`;
  updateQuizScore(sectionKey, sectionTitleFor(sectionKey));
}

function sectionTitleFor(key){
  if(key==='practice') return 'Practice';
  if(key==='mastery') return 'Mastery';
  if(key==='listening') return 'Listening';
  if(key==='homework') return 'Homework';
  return key;
}

function updateQuizScore(sectionKey, title){
  const items = state[sectionKey];
  const answered = items.filter(it=>it.selected!==null);
  const correct = answered.filter(it=>it.selected===it.correct).length;
  const total = items.length;
  const pct = total ? Math.round(100*correct/total) : 0;
  const scoretext = document.getElementById(`scoretext-${sectionKey}`);
  if(scoretext) scoretext.textContent = `Score: ${correct} / ${total} (${pct}%)`;
  const big = document.getElementById(`summarybig-${sectionKey}`);
  const pctEl = document.getElementById(`summarypct-${sectionKey}`);
  const msgEl = document.getElementById(`summarymsg-${sectionKey}`);
  if(big) big.textContent = `${correct} / ${total}`;
  if(pctEl) pctEl.textContent = answered.length===total ? `${pct}%` : `${pct}% so far (${answered.length}/${total} answered)`;
  if(msgEl) msgEl.textContent = answered.length===total ? encouragingMessage(pct) : '';
}

function encouragingMessage(pct){
  if(pct>=90) return 'Excellent work! You showed strong understanding of the grammar.';
  if(pct>=80) return 'Great work! You understand the main difference. Keep practicing.';
  if(pct>=70) return 'Good progress! A little more practice will help you feel more confident.';
  return 'Keep practicing! Review the grammar section and try the activities again.';
}

function buildGame(){
  const el = document.getElementById('sec-game');
  el.innerHTML = `
    <div class="card"><h1>🎒 Experience Explorer</h1>
      <p>Drag the correct word into the sentence. You can also click a card, then click the blank space.</p>
    </div>
    <div class="game-wrap">
      <div class="game-hud">
        <span id="gameRoundLabel">Round 1 / 10</span>
        <span id="gameScoreLabel">⭐ Score: 0</span>
      </div>
      <div class="game-map" id="gameMap"></div>
      <div id="gameStage"></div>
    </div>
  `;
  renderGameRound();
}

function renderGameRound(){
  const g = state.game;
  const stage = document.getElementById('gameStage');
  if(g.index >= g.rounds.length){ showGameComplete(); return; }
  const round = g.rounds[g.index];
  g.attempts = 0;

  // map
  const spots = ['🏛️ Museum','📚 Library','🌳 Park','🎨 Art Studio','🗺️ Experience Map','📸 Photo Album','🎒 Backpack','🏔️ Lookout Point'];
  const mapEl = document.getElementById('gameMap');
  mapEl.innerHTML = spots.map(s=>`<div class="map-spot ${s===round.spot?'active':''}">${s}</div>`).join('');

  const parts = round.sentence.split(/_+/);
  stage.innerHTML = `
    <div class="game-sentence">${parts[0]}<span class="blank-box" id="gameBlank" tabindex="0" role="button" aria-label="Drop the correct word here">?</span>${parts[1]||''}</div>
    <div class="chip-row" id="chipRow">
      ${round.options.map((opt,i)=>`<button class="chip" type="button" data-value="${opt}" id="chip-${i}">${opt}</button>`).join('')}
    </div>
    <div class="game-feedback" id="gameFeedback"></div>
    <div class="btn-row" id="gameNextRow" style="display:none;"><button class="btn amber" id="btnNextRound">Next Round ➡</button></div>
  `;
  updateGameHUD();
  wireGameInteractions();

  document.getElementById('gameBlank').addEventListener('click', ()=>{
    const sel = document.querySelector('.chip.selected');
    if(sel) attemptPlace(sel.dataset.value, sel);
  });
  document.getElementById('gameBlank').addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){
      e.preventDefault();
      const sel = document.querySelector('.chip.selected');
      if(sel) attemptPlace(sel.dataset.value, sel);
    }
  });
}

function updateGameHUD(){
  document.getElementById('gameRoundLabel').textContent = `Round ${state.game.index+1} / ${state.game.rounds.length}`;
  document.getElementById('gameScoreLabel').textContent = `⭐ Score: ${state.game.score}`;
}

function wireGameInteractions(){
  const chips = document.querySelectorAll('#chipRow .chip');
  chips.forEach(chip=>{
    chip.addEventListener('pointerdown', (e)=>startChipDrag(e, chip));
    chip.addEventListener('click', ()=>{
      if(chip.classList.contains('used')) return;
      if(chip.classList.contains('justDragged')){ chip.classList.remove('justDragged'); return; }
      const already = chip.classList.contains('selected');
      chips.forEach(c=>c.classList.remove('selected'));
      if(!already) chip.classList.add('selected');
    });
  });
}

function startChipDrag(e, chip){
  if(chip.classList.contains('used')) return;
  e.preventDefault();
  chip.setPointerCapture(e.pointerId);
  const rect = chip.getBoundingClientRect();
  const offsetX = e.clientX - rect.left;
  const offsetY = e.clientY - rect.top;
  let moved = false;
  chip.classList.add('dragging');
  chip.style.position='fixed';
  chip.style.left = rect.left+'px';
  chip.style.top = rect.top+'px';
  chip.style.width = rect.width+'px';

  function move(ev){
    moved = true;
    chip.style.left = (ev.clientX-offsetX)+'px';
    chip.style.top = (ev.clientY-offsetY)+'px';
    const blank = document.getElementById('gameBlank');
    if(blank){
      const bR = blank.getBoundingClientRect();
      const over = ev.clientX>=bR.left && ev.clientX<=bR.right && ev.clientY>=bR.top && ev.clientY<=bR.bottom;
      blank.classList.toggle('over', over);
    }
  }
  function up(ev){
    chip.removeEventListener('pointermove', move);
    chip.removeEventListener('pointerup', up);
    chip.classList.remove('dragging');
    chip.style.position=''; chip.style.left=''; chip.style.top=''; chip.style.width='';
    const blank = document.getElementById('gameBlank');
    let dropped = false;
    if(blank){
      blank.classList.remove('over');
      const bR = blank.getBoundingClientRect();
      dropped = ev.clientX>=bR.left && ev.clientX<=bR.right && ev.clientY>=bR.top && ev.clientY<=bR.bottom;
    }
    if(moved){ chip.classList.add('justDragged'); setTimeout(()=>chip.classList.remove('justDragged'),50); }
    if(dropped && moved){ attemptPlace(chip.dataset.value, chip); }
  }
  chip.addEventListener('pointermove', move);
  chip.addEventListener('pointerup', up);
}

function attemptPlace(value, chipEl){
  const round = state.game.rounds[state.game.index];
  const blank = document.getElementById('gameBlank');
  const fb = document.getElementById('gameFeedback');
  if(value === round.correct){
    blank.textContent = value;
    blank.classList.add('filled');
    document.querySelectorAll('#chipRow .chip').forEach(c=>{ c.classList.add('used'); c.style.pointerEvents='none'; });
    chipEl.classList.add('sparkle');
    state.game.score += 10;
    const completed = round.sentence.replace(/_+/, value);
    fb.className = 'game-feedback show feedback correct';
    fb.innerHTML = `<div class="fb-title">🎉 Excellent! +10 points</div><div>"${completed}"</div><div style="margin-top:6px;">${round.why}</div>`;
    document.getElementById('gameNextRow').style.display='flex';
    const nextBtn = document.getElementById('btnNextRound');
    nextBtn.textContent = (state.game.index === state.game.rounds.length-1) ? 'See Final Score 🏁' : 'Next Round ➡';
    nextBtn.onclick = ()=>{ state.game.index++; renderGameRound(); };
  } else {
    state.game.attempts++;
    blank.classList.remove('filled');
    blank.classList.add('shake');
    setTimeout(()=>blank.classList.remove('shake'), 400);
    document.querySelectorAll('.chip.selected').forEach(c=>c.classList.remove('selected'));
    fb.className = 'game-feedback show feedback incorrect';
    const hint = state.game.attempts>=2 ? `Hint: ${round.why}` : `Look again at the sentence — what does it need?`;
    fb.innerHTML = `<div class="fb-title">💡 Try again!</div><div>${hint}</div>`;
  }
  updateGameHUD();
}

function showGameComplete(){
  const stage = document.getElementById('gameStage');
  const score = state.game.score;
  stage.innerHTML = `
    <div class="summary-box">
      <h2>🎉 Experience Explorer Complete!</h2>
      <div class="big">${score} / 100</div>
      <p style="color:#EAF3FF; margin-top:6px;">${encouragingMessage(score)}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn amber" id="btnPlayAgain">🔄 Play Again</button>
      </div>
    </div>`;
  document.getElementById('gameMap').innerHTML='';
  document.getElementById('btnPlayAgain').addEventListener('click', ()=>{
    state.game = { rounds: shuffle(gameRoundsBase).map(r=>({...r, options: shuffle(r.options)})), index:0, score:0, attempts:0 };
    renderGameRound();
  });
}

let currentRate = 1;
let utterance = null;

function buildListening(){
  const intro = `

        <button class="btn" id="btnPlay">▶ Play</button>

          <button class="speed-btn" data-rate="0.75">0.75x</button>
          <button class="speed-btn active" data-rate="1">1x</button>
          <button class="speed-btn" data-rate="1.25">1.25x</button>
        </div>
      </div>
      <div id="ttsWarning" style="display:none;" class="note">This browser doesn't support text-to-speech playback — please use "Show Transcript" below to read along.</div>
      <div class="btn-row"><button class="btn secondary" id="btnTranscript">Show Transcript</button></div>
      <div class="transcript-box" id="transcriptBox">${listeningScript}</div>
    </div>`;
  renderQuizSection('listening','sec-listening','Listening', intro);

  if(!('speechSynthesis' in window)){
    document.getElementById('ttsWarning').style.display='block';
    document.getElementById('btnPlay').disabled = true;
    document.getElementById('btnPause').disabled = true;
    document.getElementById('btnReplay').disabled = true;
  } else {
    document.getElementById('btnPlay').addEventListener('click', ()=>{
      if(window.speechSynthesis.paused && window.speechSynthesis.speaking){
        window.speechSynthesis.resume();
      } else if(!window.speechSynthesis.speaking){
        speak();
      }
    });
    document.getElementById('btnPause').addEventListener('click', ()=>{
      window.speechSynthesis.pause();
    });
    document.getElementById('btnReplay').addEventListener('click', ()=>{
      window.speechSynthesis.cancel();
      speak();
    });
  }
  document.querySelectorAll('.speed-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentRate = parseFloat(btn.dataset.rate);
    });
  });
  document.getElementById('btnTranscript').addEventListener('click', (e)=>{
    const box = document.getElementById('transcriptBox');
    box.classList.toggle('show');
    e.target.textContent = box.classList.contains('show') ? 'Hide Transcript' : 'Show Transcript';
  });
}

function speak(){
  if(!('speechSynthesis' in window)) return;
  utterance = new SpeechSynthesisUtterance(listeningScript);
  utterance.rate = currentRate;
  window.speechSynthesis.speak(utterance);
}

function buildHomework(){
  const el = document.getElementById('sec-homework');
  const items = state.homework;
  let html = `<div class="card"><h1>📝 Homework</h1><p>Answer all 12 questions, then click Submit Homework to see your full results.</p></div>`;
  items.forEach((item,i)=>{
    html += `<div class="qcard" data-qi="${i}">
      <div class="qnum">Question ${i+1} of ${items.length}</div>
      <div class="qtext">${item.text}</div>
      <div class="options" id="hwopts-${i}">
        ${item.opts.map((opt,oi)=>`<button class="opt-btn" data-oi="${oi}"><span class="letter">${LETTERS[oi]}</span><span>${opt}</span></button>`).join('')}
      </div>
    </div>`;
  });
  html += `<div id="hwWarn" class="note" style="display:none;">Please answer all 12 questions before submitting.</div>
    <div class="btn-row"><button class="btn" id="btnSubmitHW">Submit Homework</button></div>
    <div id="hwResults"></div>`;
  el.innerHTML = html;

  items.forEach((item,i)=>{
    document.querySelectorAll(`#hwopts-${i} .opt-btn`).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(state.homeworkSubmitted) return;
        item.selected = parseInt(btn.dataset.oi,10);
        document.querySelectorAll(`#hwopts-${i} .opt-btn`).forEach(b=>b.classList.remove('picked'));
        btn.classList.add('picked');
      });
    });
  });

  document.getElementById('btnSubmitHW').addEventListener('click', submitHomework);
}

function submitHomework(){
  const items = state.homework;
  const unanswered = items.some(it=>it.selected===null);
  if(unanswered){
    document.getElementById('hwWarn').style.display='block';
    return;
  }
  document.getElementById('hwWarn').style.display='none';
  state.homeworkSubmitted = true;
  document.getElementById('btnSubmitHW').disabled = true;
  document.querySelectorAll('#sec-homework .opt-btn').forEach(b=>b.disabled = true);

  const correctCount = items.filter(it=>it.selected===it.correct).length;
  const pct = Math.round(100*correctCount/items.length);

  let html = `<div class="summary-box"><h2>🏆 Homework Results</h2>
    <div class="big">${correctCount} / ${items.length}</div>
    <div>${pct}%</div>
    <div style="margin-top:8px;">${encouragingMessage(pct)}</div>
  </div><div style="margin-top:18px;">`;

  items.forEach((item,i)=>{
    const isCorrect = item.selected===item.correct;
    html += `<div class="review-item ${isCorrect?'ok':'no'}">
      <div class="rq">Q${i+1}. ${item.text}</div>
      <div class="ra">Your answer: <strong>${item.opts[item.selected]}</strong></div>
      ${!isCorrect ? `<div class="ra">Correct answer: <strong>${item.opts[item.correct]}</strong></div>` : ''}
      <div class="ra">${isCorrect ? '✅ Correct!' : '❌ Not quite!'}</div>
      <div class="rwhy"><strong>Why:</strong> ${item.why}</div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('hwResults').innerHTML = html;
  document.getElementById('hwResults').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ============================================================
   RESULTS
   ============================================================ */
function scoreOf(sectionKey){
  const items = state[sectionKey];
  const answered = items.filter(it=>it.selected!==null);
  const correct = answered.filter(it=>it.selected===it.correct).length;
  return { correct, total: items.length, attempted: answered.length };
}

function buildResults(){
  const el = document.getElementById('sec-results');
  const p = scoreOf('practice');
  const m = scoreOf('mastery');
  const l = scoreOf('listening');
  const hwTotal = state.homework.length;
  const hwCorrect = state.homeworkSubmitted ? state.homework.filter(it=>it.selected===it.correct).length : 0;

  const pPct = p.total ? Math.round(100*p.correct/p.total) : 0;
  const mPct = m.total ? Math.round(100*m.correct/m.total) : 0;
  const lPct = l.total ? Math.round(100*l.correct/l.total) : 0;
  const gPct = state.game.score;
  const hPct = state.homeworkSubmitted ? Math.round(100*hwCorrect/hwTotal) : 0;

  const overall = Math.round((pPct+mPct+gPct+lPct+hPct)/5);

  const tiles = [
    {label:'Grammar Practice', pct:pPct, note: p.attempted? '' : 'Not attempted yet'},
    {label:'Reading Mastery', pct:mPct, note: m.attempted? '' : 'Not attempted yet'},
    {label:'Grammar Game', pct:gPct, note: state.game.index>0||state.game.score>0 ? '' : 'Not attempted yet'},
    {label:'Listening', pct:lPct, note: l.attempted? '' : 'Not attempted yet'},
    {label:'Homework', pct:hPct, note: state.homeworkSubmitted ? '' : 'Not submitted yet'}
  ];

  el.innerHTML = `
    <div class="card"><h1>🏆 Results Dashboard</h1></div>
    <div class="results-grid">
      ${tiles.map(t=>`<div class="result-tile">
        <div>${t.label}</div>
        <div class="pctnum">${t.pct}%</div>
        <div class="bar"><span style="width:${t.pct}%"></span></div>
        ${t.note ? `<div style="font-size:.78rem;color:var(--ink-soft);margin-top:6px;">${t.note}</div>` : ''}
      </div>`).join('')}
    </div>
    <div class="summary-box">
      <h2>Overall Score</h2>
      <div class="big">${overall}%</div>
      <p style="color:#EAF3FF; margin-top:8px;">${encouragingMessage(overall)}</p>
    </div>
    <div class="card">
      <h3>🌟 You practiced:</h3>
      <ul class="obj-list">
        <li>✓ Present Perfect for life experiences</li>
        <li>✓ Past Simple for finished past events</li>
        <li>✓ Have/Has</li>
        <li>✓ Did</li>
        <li>✓ Ever/Never</li>
        <li>✓ Time expressions</li>
        <li>✓ Past participles</li>
      </ul>
      <div class="remember-box">
        <div class="rc pp"><strong>💡 REMEMBER — Present Perfect</strong><p style="margin:6px 0 0;">"Experience — no finished time"<br>have/has + past participle</p></div>
        <div class="rc ps"><strong>💡 REMEMBER — Past Simple</strong><p style="margin:6px 0 0;">"Finished time"<br>past verb</p></div>
      </div>
      <div class="btn-row">
        <button class="btn secondary" id="btnReviewGrammar">📘 Review Grammar</button>
        <button class="btn secondary" id="btnPlayGameAgain">🎮 Play Game Again</button>
        <button class="btn" id="btnRestartFromResults">🔄 Restart Lesson</button>
      </div>
    </div>

    <div class="card">
      <h3>🗣️ Let's Talk! <span style="font-weight:400; font-size:.85rem; color:var(--ink-soft);">(Speaking Extension — teacher-led)</span></h3>
      <p>Use these fictional prompts. Students describe the character — no personal information needed.</p>
      ${speakingPrompts.map(sp=>`<div class="pair-card" style="margin-bottom:10px;">
        <div class="l1">"${sp.line}"</div>
        <div class="why">Ask: "${sp.ask}"</div>
      </div>`).join('')}
    </div>
  `;

  document.getElementById('btnReviewGrammar').addEventListener('click', ()=>showSection('grammar'));
  document.getElementById('btnPlayGameAgain').addEventListener('click', ()=>{
    state.game = { rounds: shuffle(gameRoundsBase).map(r=>({...r, options: shuffle(r.options)})), index:0, score:0, attempts:0 };
    showSection('game');
    renderGameRound();
  });
  document.getElementById('btnRestartFromResults').addEventListener('click', restartLesson);
}

/* ============================================================
   NAVIGATION / PROGRESS
   ============================================================ */
function buildNav(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = sectionsOrder.map(id=>{
    const m = sectionMeta[id];
    return `<button class="tab-btn" data-id="${id}">${m.icon} ${m.label}</button>`;
  }).join('');
  nav.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>showSection(btn.dataset.id));
  });
}

function showSection(id){
  currentIndex = sectionsOrder.indexOf(id);
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  updateProgress();
  if(id==='results') buildResults();
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('btnBack').disabled = currentIndex===0;
  const nextBtn = document.getElementById('btnNext');
  nextBtn.disabled = currentIndex===sectionsOrder.length-1;
  nextBtn.textContent = currentIndex===sectionsOrder.length-1 ? 'Finished ✓' : 'Next ➡';
}

function updateProgress(){
  const m = sectionMeta[sectionsOrder[currentIndex]];
  document.getElementById('progLabel').textContent = `Step ${currentIndex+1} of ${sectionsOrder.length}: ${m.label}`;
  const pct = Math.round((currentIndex/(sectionsOrder.length-1))*100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';
}

function restartLesson(){
  if(!confirm('Restart the whole lesson? All answers and scores will be cleared.')) return;
  freshState();
  buildAll();
  showSection('welcome');
}

/* ============================================================
   INIT
   ============================================================ */
function buildAll(){
  buildWelcome();
  buildGrammar();
  buildPractice();
  buildMastery();
  buildGame();
  buildListening();
  buildHomework();
  // results built on demand
}

function init(){
  const logoScript = document.getElementById('logo-data');
  window.__FP_LOGO__ = logoScript ? logoScript.dataset.b64 : '';

  const main = document.getElementById('main');
  main.innerHTML = sectionsOrder.map(id=>`<section class="section" id="sec-${id}"></section>`).join('');

  buildNav();
  buildAll();
  showSection('welcome');

  document.getElementById('btnHome').addEventListener('click', ()=>showSection('welcome'));
  document.getElementById('btnRestart').addEventListener('click', restartLesson);
  document.getElementById('btnBack').addEventListener('click', ()=>{
    if(currentIndex>0) showSection(sectionsOrder[currentIndex-1]);
  });
  document.getElementById('btnNext').addEventListener('click', ()=>{
    if(currentIndex<sectionsOrder.length-1) showSection(sectionsOrder[currentIndex+1]);
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
